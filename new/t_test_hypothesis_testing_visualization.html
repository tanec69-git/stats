<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t-Test Hypothesis Testing Visualization</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jStat for statistical calculations (t-distribution pdf and inv) -->
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 sm:p-8 flex flex-col items-center">

    <div class="max-w-6xl w-full space-y-6">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Student's t-Test Visualization</h1>
            <p class="text-slate-500 mt-2">Calculate critical values dynamically and visualize rejection regions.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Inputs Section -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Test Parameters</h2>
                
                <div class="space-y-5">
                    <!-- Test Type -->
                    <div>
                        <label for="testType" class="block text-sm font-medium text-slate-700 mb-1">Test Type</label>
                        <select id="testType" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white text-sm">
                            <option value="two-tailed">Two-Tailed (≠)</option>
                            <option value="left-tailed">Left-Tailed (<)</option>
                            <option value="right-tailed">Right-Tailed (>)</option>
                        </select>
                    </div>

                    <!-- Degrees of Freedom (df) -->
                    <div>
                        <label for="inputDf" class="block text-sm font-medium text-slate-700 mb-1">
                            Degrees of Freedom (df)
                        </label>
                        <p class="text-xs text-slate-400 mb-1">Typically n - 1 for a one-sample test.</p>
                        <input type="number" id="inputDf" step="1" min="1" value="19" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                    </div>
                    
                    <!-- Significance Level (alpha) -->
                    <div>
                        <label for="inputAlpha" class="block text-sm font-medium text-slate-700 mb-1">
                            Significance Level (α)
                        </label>
                        <p class="text-xs text-slate-400 mb-1">Probability of rejecting the null hypothesis when it is true.</p>
                        <input type="number" id="inputAlpha" step="0.01" min="0.001" max="0.999" value="0.05" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                    </div>

                    <!-- Test Statistic -->
                    <div>
                        <label for="tStat" class="block text-sm font-medium text-slate-700 mb-1">
                            Test Statistic (t-score)
                        </label>
                        <p class="text-xs text-slate-400 mb-1">The calculated t-value from your sample data.</p>
                        <input type="number" id="tStat" step="0.01" value="2.45" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                    </div>

                    <button id="btnUpdate" class="w-full mt-2 bg-indigo-700 hover:bg-indigo-800 text-white font-semibold py-3 px-4 rounded-lg shadow-sm transition cursor-pointer">
                        Update Visualization
                    </button>
                </div>
            </div>

            <!-- Visualization and Conclusion Section -->
            <div class="lg:col-span-8 space-y-6 flex flex-col">
                
                <!-- Chart Container -->
                <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex-grow">
                    <div class="w-full aspect-[4/3] sm:aspect-[16/9] relative">
                        <canvas id="tChart"></canvas>
                    </div>
                </div>

                <!-- Conclusion & Stats Box -->
                <div id="conclusionBox" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 transition-colors duration-300">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col justify-center border-b md:border-b-0 md:border-r border-slate-200 pb-4 md:pb-0 pr-0 md:pr-4">
                            <h3 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-1">Critical Values</h3>
                            <div class="text-slate-800 font-medium font-mono text-lg" id="critValText">
                                <!-- Populated via JS -->
                            </div>
                        </div>
                        <div class="flex flex-col justify-center text-center md:text-left">
                            <h3 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Conclusion</h3>
                            <p id="conclusionText" class="text-2xl font-bold"></p>
                            <p id="conclusionReason" class="text-slate-600 mt-1 text-sm"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        /**
         * Generates points for the t-distribution curve
         */
        function generateCurveData(min, max, df, step = 0.05) {
            const data = [];
            for (let x = min; x <= max; x += step) {
                // Round x to avoid floating point precision quirks
                const roundedX = Math.round(x * 1000) / 1000;
                // Calculate y using jStat t-distribution probability density function
                const y = jStat.studentt.pdf(roundedX, df);
                data.push({ x: roundedX, y: y });
            }
            return data;
        }

        function updateVisualization() {
            // 1. Gather & Validate Inputs
            const testType = document.getElementById('testType').value;
            const df = parseInt(document.getElementById('inputDf').value) || 1;
            const alpha = parseFloat(document.getElementById('inputAlpha').value) || 0.05;
            const tStat = parseFloat(document.getElementById('tStat').value) || 0;

            // Ensure valid alpha limits
            const safeAlpha = Math.max(0.0001, Math.min(0.9999, alpha));

            // 2. Calculate Critical Values using jStat.studentt.inv
            let tCritLeft = null;
            let tCritRight = null;
            let isRejected = false;
            let rejectConditionText = "";
            let critValDisplay = "";

            if (testType === 'left-tailed') {
                tCritLeft = jStat.studentt.inv(safeAlpha, df); // inverse CDF
                isRejected = tStat <= tCritLeft;
                rejectConditionText = `t Statistic (${tStat.toFixed(3)}) is ${isRejected ? '≤' : '>'} Critical Value (${tCritLeft.toFixed(3)})`;
                critValDisplay = `t_crit = ${tCritLeft.toFixed(3)}`;

            } else if (testType === 'right-tailed') {
                tCritRight = jStat.studentt.inv(1 - safeAlpha, df); // inverse CDF of upper tail
                isRejected = tStat >= tCritRight;
                rejectConditionText = `t Statistic (${tStat.toFixed(3)}) is ${isRejected ? '≥' : '<'} Critical Value (${tCritRight.toFixed(3)})`;
                critValDisplay = `t_crit = ${tCritRight.toFixed(3)}`;

            } else if (testType === 'two-tailed') {
                tCritLeft = jStat.studentt.inv(safeAlpha / 2, df);
                tCritRight = jStat.studentt.inv(1 - safeAlpha / 2, df); // Due to symmetry, this is usually Math.abs(tCritLeft)
                
                isRejected = tStat <= tCritLeft || tStat >= tCritRight;
                rejectConditionText = `t Statistic (${tStat.toFixed(3)}) falls ${isRejected ? 'inside' : 'outside'} the rejection regions (≤ ${tCritLeft.toFixed(3)} or ≥ ${tCritRight.toFixed(3)})`;
                critValDisplay = `t_crit = ±${tCritRight.toFixed(3)}`;
            }

            // 3. Determine Dynamic Chart Bounds
            // Max bound between standard ±4, the critical value, and the test statistic
            let maxCheck = Math.max(
                4, 
                tCritLeft !== null ? Math.abs(tCritLeft) : 0, 
                tCritRight !== null ? Math.abs(tCritRight) : 0,
                Math.abs(tStat)
            );
            const plotMax = Math.ceil(maxCheck) + 1; // Give it 1 unit of padding
            const plotMin = -plotMax;

            // Generate full curve
            const fullCurve = generateCurveData(plotMin, plotMax, df);
            const peakDensity = jStat.studentt.pdf(0, df); // Y-axis max height approx

            // 4. Build Datasets
            const datasets = [];

            // Helper to add a rejection region
            const addRejectionRegion = (minX, maxX, label) => {
                datasets.push({
                    label: label,
                    data: generateCurveData(minX, maxX, df),
                    backgroundColor: 'rgba(239, 68, 68, 0.55)', // Red Shading
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1.5,
                    fill: 'origin',      // Fill to the x-axis
                    pointRadius: 0,      // Crucial: no dots
                    showLine: true       // Crucial: draw the line
                });
            };

            if (testType === 'left-tailed' || testType === 'two-tailed') {
                addRejectionRegion(plotMin, tCritLeft, 'Rejection Region (Left)');
            }
            
            if (testType === 'right-tailed' || testType === 'two-tailed') {
                addRejectionRegion(tCritRight, plotMax, 'Rejection Region (Right)');
            }

            // Main Distribution Curve (Outline)
            datasets.push({
                label: `t-Distribution (df=${df})`,
                data: fullCurve,
                borderColor: '#4f46e5', // Indigo 600
                borderWidth: 2.5,
                fill: false,
                pointRadius: 0,
                showLine: true,
                order: 10 // Draw over the shading
            });

            // Test Statistic Dashed Line
            datasets.push({
                label: 'Test Statistic (t)',
                data: [{ x: tStat, y: 0 }, { x: tStat, y: peakDensity * 1.05 }],
                borderColor: '#0284c7', // Sky 600
                borderWidth: 3,
                borderDash: [6, 4],
                pointBackgroundColor: '#0284c7',
                pointRadius: [0, 5], // Dot only at the top of the line
                fill: false,
                showLine: true,
                order: 15
            });

            // 5. Update Chart.js
            const ctx = document.getElementById('tChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'scatter', // Use scatter so we can plot arbitrary (x, y) coordinates cleanly
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                filter: function(item, chart) {
                                    // Hide duplicate legend for two-tailed to keep it clean
                                    return !item.text.includes('(Left)');
                                },
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `t: ${context.parsed.x}, density: ${context.parsed.y.toFixed(4)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: plotMin,
                            max: plotMax,
                            grid: {
                                color: (ctx) => ctx.tick.value === 0 ? '#94a3b8' : '#e2e8f0',
                                lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1
                            },
                            title: {
                                display: true,
                                text: 't Score',
                                font: { weight: 'bold', size: 14 }
                            }
                        },
                        y: {
                            min: 0,
                            // Set max slightly above peak to fit the t-stat marker
                            max: peakDensity * 1.15,
                            title: {
                                display: true,
                                text: 'Probability Density'
                            }
                        }
                    }
                }
            });

            // 6. Update Conclusion and UI Text
            const conclusionBox = document.getElementById('conclusionBox');
            const conclusionText = document.getElementById('conclusionText');
            const conclusionReason = document.getElementById('conclusionReason');
            const critValText = document.getElementById('critValText');

            critValText.innerHTML = critValDisplay;

            if (isRejected) {
                conclusionBox.className = "p-6 rounded-2xl shadow-sm border transition-colors duration-300 bg-rose-50 border-rose-200";
                conclusionText.className = "text-2xl md:text-3xl font-bold text-rose-700";
                conclusionText.textContent = "Reject H₀";
            } else {
                conclusionBox.className = "p-6 rounded-2xl shadow-sm border transition-colors duration-300 bg-emerald-50 border-emerald-200";
                conclusionText.className = "text-2xl md:text-3xl font-bold text-emerald-700";
                conclusionText.textContent = "Fail to Reject H₀";
            }
            
            conclusionReason.textContent = rejectConditionText;
        }

        // Initialize and bind Event Listeners
        window.addEventListener('DOMContentLoaded', () => {
            updateVisualization(); // Initial draw
            
            // Re-draw on button click
            document.getElementById('btnUpdate').addEventListener('click', updateVisualization);
            
            // Re-draw on Enter key in any input field
            const inputs = ['inputDf', 'inputAlpha', 'tStat'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') updateVisualization();
                });
            });
            
            // Re-draw on dropdown change
            document.getElementById('testType').addEventListener('change', updateVisualization);
        });
    </script>
</body>
</html>
