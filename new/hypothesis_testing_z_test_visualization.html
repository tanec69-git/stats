<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypothesis Testing Z-Test Visualization</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 sm:p-8 flex flex-col items-center">

    <div class="max-w-5xl w-full space-y-6">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900">Z-Test Hypothesis Testing</h1>
            <p class="text-slate-500 mt-2">Visualize rejection regions and determine statistical significance.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Inputs Section -->
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Test Parameters</h2>
                
                <div class="space-y-5">
                    <!-- Test Type -->
                    <div>
                        <label for="testType" class="block text-sm font-medium text-slate-700 mb-1">Test Type</label>
                        <select id="testType" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white text-sm">
                            <option value="two-tailed">Two-Tailed (≠)</option>
                            <option value="left-tailed">Left-Tailed (<)</option>
                            <option value="right-tailed">Right-Tailed (>)</option>
                        </select>
                    </div>
                    
                    <!-- Z Critical Value -->
                    <div>
                        <label for="zCrit" class="block text-sm font-medium text-slate-700 mb-1">
                            Z Critical Value (Positive)
                        </label>
                        <p class="text-xs text-slate-400 mb-1">e.g., 1.96 for 95% confidence two-tailed.</p>
                        <input type="number" id="zCrit" step="0.01" min="0" value="1.96" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                    </div>

                    <!-- Z Test Statistic -->
                    <div>
                        <label for="zStat" class="block text-sm font-medium text-slate-700 mb-1">
                            Z Test Statistic
                        </label>
                        <p class="text-xs text-slate-400 mb-1">The calculated Z score from your data.</p>
                        <input type="number" id="zStat" step="0.01" value="2.15" 
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
                    </div>

                    <button id="btnUpdate" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-lg shadow-sm transition">
                        Update Graph
                    </button>
                </div>
            </div>

            <!-- Visualization and Conclusion Section -->
            <div class="lg:col-span-2 space-y-6 flex flex-col">
                
                <!-- Chart Container -->
                <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex-grow">
                    <div class="w-full aspect-[4/3] sm:aspect-[16/9] relative">
                        <canvas id="zChart"></canvas>
                    </div>
                </div>

                <!-- Conclusion Box -->
                <div id="conclusionBox" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center transition-colors duration-300">
                    <h3 class="text-sm font-bold uppercase tracking-wide text-slate-500 mb-2">Conclusion</h3>
                    <p id="conclusionText" class="text-2xl font-semibold"></p>
                    <p id="conclusionReason" class="text-slate-600 mt-2 text-sm"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        // Standard Normal PDF
        function normalPDF(x) {
            return (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
        }

        function generateCurveData(min, max, step = 0.05) {
            const data = [];
            for (let x = min; x <= max; x += step) {
                // To avoid floating point issues, round to 3 decimals
                const roundedX = Math.round(x * 1000) / 1000;
                data.push({ x: roundedX, y: normalPDF(roundedX) });
            }
            return data;
        }

        function updateVisualization() {
            // Get input values
            const testType = document.getElementById('testType').value;
            // Always parse absolute value for Z Crit to handle user mistakes safely
            const zCritRaw = parseFloat(document.getElementById('zCrit').value);
            const zCrit = Math.abs(isNaN(zCritRaw) ? 1.96 : zCritRaw); 
            const zStat = parseFloat(document.getElementById('zStat').value) || 0;

            // Generate full curve
            const fullCurve = generateCurveData(-4, 4);

            // Datasets Array
            const datasets = [];

            // 1. Rejection Regions (Red Shading)
            let isRejected = false;
            let rejectConditionText = "";

            if (testType === 'left-tailed') {
                datasets.push({
                    label: 'Rejection Region',
                    data: generateCurveData(-4, -zCrit),
                    backgroundColor: 'rgba(239, 68, 68, 0.6)', // Bright Red
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1,
                    fill: 'origin',
                    pointRadius: 0,
                    showLine: true
                });
                
                isRejected = zStat <= -zCrit;
                rejectConditionText = `Z Test Statistic (${zStat}) is ${isRejected ? '≤' : '>'} Critical Value (${-zCrit})`;

            } else if (testType === 'right-tailed') {
                datasets.push({
                    label: 'Rejection Region',
                    data: generateCurveData(zCrit, 4),
                    backgroundColor: 'rgba(239, 68, 68, 0.6)', // Bright Red
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1,
                    fill: 'origin',
                    pointRadius: 0,
                    showLine: true
                });

                isRejected = zStat >= zCrit;
                rejectConditionText = `Z Test Statistic (${zStat}) is ${isRejected ? '≥' : '<'} Critical Value (${zCrit})`;

            } else if (testType === 'two-tailed') {
                // Left side
                datasets.push({
                    label: 'Rejection Region (Left)',
                    data: generateCurveData(-4, -zCrit),
                    backgroundColor: 'rgba(239, 68, 68, 0.6)', 
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1,
                    fill: 'origin',
                    pointRadius: 0,
                    showLine: true
                });
                // Right side
                datasets.push({
                    label: 'Rejection Region (Right)',
                    data: generateCurveData(zCrit, 4),
                    backgroundColor: 'rgba(239, 68, 68, 0.6)', 
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1,
                    fill: 'origin',
                    pointRadius: 0,
                    showLine: true
                });

                isRejected = zStat <= -zCrit || zStat >= zCrit;
                rejectConditionText = `Z Test Statistic (${zStat}) falls ${isRejected ? 'inside' : 'outside'} the rejection regions (≤ ${-zCrit} or ≥ ${zCrit})`;
            }

            // 2. Main Distribution Curve (Outlines the full shape)
            datasets.push({
                label: 'Standard Normal Distribution',
                data: fullCurve,
                borderColor: '#475569', // Slate 600
                borderWidth: 2,
                fill: false,
                pointRadius: 0,
                showLine: true,
                order: 10 // draw curve over the shading
            });

            // 3. Z Test Statistic Line
            datasets.push({
                label: 'Z Test Statistic',
                data: [{ x: zStat, y: 0 }, { x: zStat, y: 0.45 }],
                borderColor: '#2563eb', // Blue 600
                borderWidth: 3,
                borderDash: [5, 5],
                pointBackgroundColor: '#2563eb',
                pointRadius: [0, 4], // Dot only at the top of the line
                fill: false,
                showLine: true
            });

            // Update Chart
            const ctx = document.getElementById('zChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'scatter', // Scatter allows precise x,y positioning
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                // Filter out duplicate legend items for two-tailed
                                filter: function(item, chart) {
                                    return !item.text.includes('(Left)');
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `x: ${context.parsed.x}, y: ${context.parsed.y.toFixed(3)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: -4,
                            max: 4,
                            grid: {
                                color: (ctx) => ctx.tick.value === 0 ? '#94a3b8' : '#e2e8f0',
                                lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1
                            },
                            title: {
                                display: true,
                                text: 'Z Score',
                                font: { weight: 'bold' }
                            }
                        },
                        y: {
                            min: 0,
                            max: 0.5,
                            title: {
                                display: true,
                                text: 'Probability Density'
                            }
                        }
                    }
                }
            });

            // Update Output Text
            const conclusionBox = document.getElementById('conclusionBox');
            const conclusionText = document.getElementById('conclusionText');
            const conclusionReason = document.getElementById('conclusionReason');

            if (isRejected) {
                conclusionBox.className = "p-6 rounded-2xl shadow-sm border text-center transition-colors duration-300 bg-red-50 border-red-200";
                conclusionText.className = "text-2xl font-bold text-red-700";
                conclusionText.textContent = "Reject the Null Hypothesis";
            } else {
                conclusionBox.className = "p-6 rounded-2xl shadow-sm border text-center transition-colors duration-300 bg-green-50 border-green-200";
                conclusionText.className = "text-2xl font-bold text-green-700";
                conclusionText.textContent = "Fail to Reject the Null Hypothesis";
            }
            
            conclusionReason.textContent = rejectConditionText;
        }

        // Event Listeners
        window.addEventListener('DOMContentLoaded', () => {
            updateVisualization();
            
            document.getElementById('btnUpdate').addEventListener('click', updateVisualization);
            
            // Also update on enter key press in inputs
            const inputs = ['zCrit', 'zStat'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') updateVisualization();
                });
            });
            
            // Quick update on dropdown change
            document.getElementById('testType').addEventListener('change', updateVisualization);
        });
    </script>
</body>
</html>
