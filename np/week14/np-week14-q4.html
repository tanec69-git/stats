<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Distribution Packing Machine App (Table-Consistent)</title>
    
    <!-- MathJax for rendering LaTeX equations -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 850px;
            width: 100%;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6c757d;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            color: #212529;
        }
        .generate-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .generate-btn:hover {
            background-color: #0056b3;
        }
        .question-box {
            background-color: #f8f9fa;
            padding: 25px;
            border: 1px solid #dee2e6;
            border-left: 5px solid #6c757d;
            border-radius: 4px;
            margin-bottom: 30px;
            font-size: 1.15rem;
            line-height: 1.6;
            color: #000000;
        }
        .part-container {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .part-container:last-child {
            border-bottom: none;
        }
        .question-part {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #000;
        }
        .solution-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
            width: 100%;
        }
        .solution-btn:hover {
            background-color: #218838;
        }
        .solution-box {
            background-color: #fdfdfe;
            padding: 20px;
            border: 1px solid #e9ecef;
            border-left: 4px solid #28a745;
            border-radius: 5px;
            display: none;
            line-height: 1.6;
            overflow-x: auto;
        }
        canvas {
            display: block;
            margin: 20px auto;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h2>Continuous Probability App</h2>
        <button class="generate-btn" onclick="generateNewQuestion()">Generate New Question</button>
    </div>
    
    <div class="question-box" id="question-text">
        <!-- Question injected here -->
    </div>

    <!-- Part A (i) -->
    <div class="part-container">
        <div class="question-part" id="part-ai-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-ai', this, 'ai')">Show Solution for (a)(i)</button>
        <div id="sol-ai" class="solution-box">
            <div id="sol-ai-content"></div>
            <canvas id="canvas-ai" width="600" height="250"></canvas>
        </div>
    </div>

    <!-- Part A (ii) -->
    <div class="part-container">
        <div class="question-part" id="part-aii-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-aii', this, 'aii')">Show Solution for (a)(ii)</button>
        <div id="sol-aii" class="solution-box">
            <div id="sol-aii-content"></div>
            <canvas id="canvas-aii" width="600" height="250"></canvas>
        </div>
    </div>

    <!-- Part A (iii) -->
    <div class="part-container">
        <div class="question-part" id="part-aiii-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-aiii', this, 'aiii')">Show Solution for (a)(iii)</button>
        <div id="sol-aiii" class="solution-box">
            <div id="sol-aiii-content"></div>
            <canvas id="canvas-aiii" width="600" height="250"></canvas>
        </div>
    </div>

    <!-- Part B -->
    <div class="part-container">
        <div class="question-part" id="part-b-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-b', this, 'b')">Show Solution for (b)</button>
        <div id="sol-b" class="solution-box">
            <div id="sol-b-content"></div>
        </div>
    </div>

    <!-- Part C -->
    <div class="part-container">
        <div class="question-part" id="part-c-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-c', this, 'c')">Show Solution for (c)</button>
        <div id="sol-c" class="solution-box">
            <div id="sol-c-content"></div>
            <canvas id="canvas-c" width="600" height="250"></canvas>
        </div>
    </div>
</div>

<script>
    // --- Data Model ---
    let probData = {
        mu: 203,
        sigma: 3.5,
        ai_val: 198,
        aii_val: 200,
        aiii_low: 195,
        aiii_high: 203,
        batch: 1500,
        c_percent: 2.5
    };

    let solvedProbs = { ai: 0, aii: 0, aiii: 0, c_mass: 0 };

    // --- Math Functions (Simulating Exact Table Lookups) ---
    function exactNormalCDF(z) {
        let isNegative = z < 0;
        z = Math.abs(z);
        const p = 0.2316419, b1 = 0.319381530, b2 = -0.356563782, b3 = 1.781477937, b4 = -1.821255978, b5 = 1.330274429;
        const t = 1 / (1 + p * z);
        const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * z * z);
        const cdf = 1 - pdf * (b1 * t + b2 * Math.pow(t, 2) + b3 * Math.pow(t, 3) + b4 * Math.pow(t, 4) + b5 * Math.pow(t, 5));
        return isNegative ? (1 - cdf) : cdf;
    }

    // This function mimics a human looking up the value in "3 Standard Normal Table_A4size.pdf"
    function tableNormalCDF(z) {
        let isNegative = z < 0;
        let absZ = Math.abs(z);
        
        // Round to 3 decimal places for the table
        let zStr = absZ.toFixed(3);
        let rowCol = parseFloat(zStr.substring(0, 4)); // Base 2 decimals (e.g. 1.42)
        let addDigit = parseInt(zStr.substring(4, 5)); // 3rd decimal place (e.g. 9)
        
        let baseProb = parseFloat(exactNormalCDF(rowCol).toFixed(4));
        let finalProb = baseProb;
        
        // Apply ADD column logic
        if (addDigit > 0) {
            let nextProb = parseFloat(exactNormalCDF(rowCol + 0.01).toFixed(4));
            let diff = Math.round((nextProb - baseProb) * 10000);
            let addValue = Math.round((diff * addDigit) / 10);
            finalProb += (addValue / 10000);
        }
        
        if (finalProb > 0.9999) finalProb = 0.9999;
        
        // Apply the rule for negative z from the document
        return isNegative ? parseFloat((1 - finalProb).toFixed(4)) : parseFloat(finalProb.toFixed(4));
    }

    function normalPDF(x, mu, sigma) {
        const factor = 1 / (sigma * Math.sqrt(2 * Math.PI));
        const exponent = -0.5 * Math.pow((x - mu) / sigma, 2);
        return factor * Math.exp(exponent);
    }

    function inverseNormalCDF(p) {
        // Use Critical values for the normal distribution explicitly provided in the source table
        const criticalValues = {
            0.75: 0.674, 0.90: 1.282, 0.95: 1.645, 0.975: 1.960,
            0.99: 2.326, 0.995: 2.576, 0.9975: 2.807, 0.999: 3.090, 0.9995: 3.291
        };
        
        let lookupP = p > 0.5 ? p : (1 - p);
        lookupP = parseFloat(lookupP.toFixed(4));
        
        // If it perfectly matches a critical value, return it
        if (criticalValues[lookupP]) {
            return p > 0.5 ? criticalValues[lookupP] : -criticalValues[lookupP];
        }

        // Fallback robust approximation if it's not in the critical table
        const a1 = -3.969683028665376e+01, a2 = 2.209460984245205e+02,
              a3 = -2.759285104469687e+02, a4 = 1.383577518672690e+02,
              a5 = -3.066479806614716e+01, a6 = 2.506628277459239e+00;
        const b1 = -5.447609879822406e+01, b2 = 1.615858368580409e+02,
              b3 = -1.556989798598866e+02, b4 = 6.680131188771972e+01,
              b5 = -1.328068155288572e+01;
        const c1 = -7.784894002430293e-03, c2 = -3.223964580411365e-01,
              c3 = -2.400758277161838e+00, c4 = -2.549732539343734e+00,
              c5 = 4.374664141464968e+00,  c6 = 2.938163982698783e+00;
        const d1 = 7.784695709041462e-03,  d2 = 3.224671290700398e-01,
              d3 = 2.445134137142996e+00,  d4 = 3.754408661907416e+00;
        const pLow = 0.02425;
        const pHigh = 1 - pLow;
        let q, r;
        if (p < pLow) {
            q = Math.sqrt(-2 * Math.log(p));
            return (((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) /
                   ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
        } else if (p <= pHigh) {
            q = p - 0.5;
            r = q * q;
            return (((((a1 * r + a2) * r + a3) * r + a4) * r + a5) * r + a6) * q /
                   (((((b1 * r + b2) * r + b3) * r + b4) * r + b5) * r + 1);
        } else {
            q = Math.sqrt(-2 * Math.log(1 - p));
            return -(((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) /
                    ((((d1 * q + d2) * q + d3) * q + d4) * q + 1);
        }
    }

    // --- Application Logic ---
    function renderQuestion() {
        document.getElementById('question-text').innerHTML = `
            4. (a) &nbsp; Packages from a packing machine have a mass which is <strong>normal distributed</strong> with a mean of ${probData.mu} g and standard deviation ${probData.sigma} g. Find the probability that a package from a machine weighs<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (i) &nbsp; less than ${probData.ai_val}g<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (ii) &nbsp; at least ${probData.aii_val} g<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (iii) between ${probData.aiii_low}g and ${probData.aiii_high} g .<br><br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (Give all answers in <strong>(a) to 4 decimal places</strong>)<br><br>
            &nbsp;&nbsp;&nbsp; (b) &nbsp; In a batch of ${probData.batch} packages from the same machine, how many would you expect to weigh between ${probData.aiii_low}g and ${probData.aiii_high}g?<br><br>
            &nbsp;&nbsp;&nbsp; (c) &nbsp; Find the <strong>mass m</strong> such that only ${probData.c_percent}% of the packages contain less than m grams.
        `;

        document.getElementById('part-ai-text').innerHTML = `(a)(i) less than ${probData.ai_val}g`;
        document.getElementById('part-aii-text').innerHTML = `(a)(ii) at least ${probData.aii_val}g`;
        document.getElementById('part-aiii-text').innerHTML = `(a)(iii) between ${probData.aiii_low}g and ${probData.aiii_high}g`;
        document.getElementById('part-b-text').innerHTML = `(b) Expected packages between ${probData.aiii_low}g and ${probData.aiii_high}g out of ${probData.batch}`;
        document.getElementById('part-c-text').innerHTML = `(c) Mass m for lowest ${probData.c_percent}%`;

        const parts = ['ai', 'aii', 'aiii', 'b', 'c'];
        parts.forEach(part => {
            const solDiv = document.getElementById(`sol-${part}`);
            if(solDiv) {
                solDiv.style.display = 'none';
                const btn = solDiv.previousElementSibling;
                btn.innerText = `Show Solution for ${part.replace('a', '(a)(').replace('i)', 'i))').replace('b', '(b)').replace('c', '(c)')}`;
                btn.style.backgroundColor = "#28a745";
            }
        });
    }

    function toggleSolution(divId, btn, part) {
        const solDiv = document.getElementById(divId);
        
        if (solDiv.style.display === 'none' || solDiv.style.display === '') {
            generateSolutionContent(part);
            solDiv.style.display = 'block';
            btn.innerText = "Hide Solution";
            btn.style.backgroundColor = "#dc3545";
            
            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById(`${divId}-content`)]).then(() => {
                    if (part !== 'b') drawCanvas(part);
                });
            }
        } else {
            solDiv.style.display = 'none';
            btn.innerText = `Show Solution`;
            btn.style.backgroundColor = "#28a745";
        }
    }

    function generateSolutionContent(part) {
        const contentDiv = document.getElementById(`sol-${part}-content`);
        let html = `Let \\( X \\) be the mass of a package. \\( X \\sim N(${probData.mu}, ${probData.sigma}^2) \\).<br><br>`;
        
        if (part === 'ai') {
            let zRaw = (probData.ai_val - probData.mu) / probData.sigma;
            let z = parseFloat(zRaw.toFixed(3)); // Rounded to match 3-decimal table
            solvedProbs.ai = tableNormalCDF(z);
            html += `
                <strong>Find \\( P(X < ${probData.ai_val}) \\)</strong><br>
                $$ Z = \\frac{${probData.ai_val} - ${probData.mu}}{${probData.sigma}} \\approx ${z.toFixed(3)} $$
                $$ P(X < ${probData.ai_val}) = P(Z < ${z.toFixed(3)}) $$
                $$ = \\Phi(${z.toFixed(3)}) = \\mathbf{${solvedProbs.ai.toFixed(4)}} $$
            `;
        } 
        else if (part === 'aii') {
            let zRaw = (probData.aii_val - probData.mu) / probData.sigma;
            let z = parseFloat(zRaw.toFixed(3));
            solvedProbs.aii = parseFloat((1 - tableNormalCDF(z)).toFixed(4));
            html += `
                <strong>Find \\( P(X \\ge ${probData.aii_val}) \\)</strong><br>
                $$ Z = \\frac{${probData.aii_val} - ${probData.mu}}{${probData.sigma}} \\approx ${z.toFixed(3)} $$
                $$ P(X \\ge ${probData.aii_val}) = P(Z \\ge ${z.toFixed(3)}) = 1 - P(Z < ${z.toFixed(3)}) $$
                $$ = 1 - \\Phi(${z.toFixed(3)}) = 1 - ${tableNormalCDF(z).toFixed(4)} = \\mathbf{${solvedProbs.aii.toFixed(4)}} $$
            `;
        } 
        else if (part === 'aiii') {
            let z1Raw = (probData.aiii_low - probData.mu) / probData.sigma;
            let z2Raw = (probData.aiii_high - probData.mu) / probData.sigma;
            let z1 = parseFloat(z1Raw.toFixed(3));
            let z2 = parseFloat(z2Raw.toFixed(3));
            solvedProbs.aiii = parseFloat((tableNormalCDF(z2) - tableNormalCDF(z1)).toFixed(4));
            html += `
                <strong>Find \\( P(${probData.aiii_low} < X < ${probData.aiii_high}) \\)</strong><br>
                $$ Z_1 = \\frac{${probData.aiii_low} - ${probData.mu}}{${probData.sigma}} \\approx ${z1.toFixed(3)} $$
                $$ Z_2 = \\frac{${probData.aiii_high} - ${probData.mu}}{${probData.sigma}} \\approx ${z2.toFixed(3)} $$
                $$ P(${probData.aiii_low} < X < ${probData.aiii_high}) = P(${z1.toFixed(3)} < Z < ${z2.toFixed(3)}) $$
                $$ = \\Phi(${z2.toFixed(3)}) - \\Phi(${z1.toFixed(3)}) = ${tableNormalCDF(z2).toFixed(4)} - ${tableNormalCDF(z1).toFixed(4)} = \\mathbf{${solvedProbs.aiii.toFixed(4)}} $$
            `;
        }
        else if (part === 'b') {
            if (solvedProbs.aiii === 0) {
                let z1 = parseFloat(((probData.aiii_low - probData.mu) / probData.sigma).toFixed(3));
                let z2 = parseFloat(((probData.aiii_high - probData.mu) / probData.sigma).toFixed(3));
                solvedProbs.aiii = parseFloat((tableNormalCDF(z2) - tableNormalCDF(z1)).toFixed(4));
            }
            let expected = solvedProbs.aiii * probData.batch;
            html += `
                <strong>Calculate Expected Number</strong><br>
                Using the probability from (a)(iii): \\( P(${probData.aiii_low} < X < ${probData.aiii_high}) = ${solvedProbs.aiii.toFixed(4)} \\)<br>
                $$ \\text{Expected} = n \\times p $$
                $$ = ${probData.batch} \\times ${solvedProbs.aiii.toFixed(4)} $$
                $$ = ${expected.toFixed(2)} $$
                <br>
                You would expect approximately <strong>${Math.round(expected)}</strong> packages.
            `;
        }
        else if (part === 'c') {
            let p = probData.c_percent / 100;
            let z = inverseNormalCDF(p);
            solvedProbs.c_mass = probData.mu + (z * probData.sigma);
            
            html += `
                <strong>Find mass \\( m \\) for the bottom ${probData.c_percent}%</strong><br>
                We are given \\( P(X < m) = ${p.toFixed(3)} \\).<br>
                Lookup critical value for an area of ${p.toFixed(3)} to the left:<br>
                $$ P(Z < z) = ${p.toFixed(3)} \\implies z = ${z.toFixed(3)} $$
                Un-standardize to find \\( m \\):
                $$ m = \\mu + z\\sigma $$
                $$ m = ${probData.mu} + (${z.toFixed(3)})(${probData.sigma}) $$
                $$ m = \\mathbf{${solvedProbs.c_mass.toFixed(2)}\\text{ g}} $$
            `;
        }

        contentDiv.innerHTML = html;
    }

    function drawCanvas(part) {
        const canvas = document.getElementById(`canvas-${part}`);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);

        const mu = probData.mu;
        const sigma = probData.sigma;
        
        const minX = mu - 4 * sigma;
        const maxX = mu + 4 * sigma;
        const maxY = normalPDF(mu, mu, sigma) * 1.15; 
        const padding = 30;
        
        const mapX = x => padding + ((x - minX) / (maxX - minX)) * (width - 2 * padding);
        const mapY = y => height - padding - (y / maxY) * (height - 2 * padding);

        let type, val1, val2;
        if (part === 'ai') { type = 'less'; val1 = probData.ai_val; }
        else if (part === 'aii') { type = 'greater'; val1 = probData.aii_val; }
        else if (part === 'aiii') { type = 'between'; val1 = probData.aiii_low; val2 = probData.aiii_high; }
        else if (part === 'c') { type = 'less'; val1 = solvedProbs.c_mass; }

        ctx.fillStyle = 'rgba(40, 167, 69, 0.4)';
        ctx.beginPath();
        ctx.moveTo(mapX(type === 'greater' ? val1 : minX), mapY(0));
        
        for (let x = minX; x <= maxX; x += (maxX - minX)/200) {
            let y = normalPDF(x, mu, sigma);
            if ((type === 'less' && x <= val1) || 
                (type === 'greater' && x >= val1) ||
                (type === 'between' && x >= val1 && x <= val2)) {
                ctx.lineTo(mapX(x), mapY(y));
            } else if (ctx.fillStyle !== 'rgba(0,0,0,0)') {
                 ctx.lineTo(mapX(x), mapY(0));
            }
        }
        
        if (type === 'less') ctx.lineTo(mapX(val1), mapY(0));
        if (type === 'greater') ctx.lineTo(mapX(maxX), mapY(0));
        if (type === 'between') {
            ctx.lineTo(mapX(val2), mapY(0));
            ctx.lineTo(mapX(val1), mapY(0));
        }
        ctx.fill();

        ctx.strokeStyle = '#343a40';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = minX; x <= maxX; x += (maxX - minX)/100) {
            ctx.lineTo(mapX(x), mapY(normalPDF(x, mu, sigma)));
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(mapX(minX), mapY(0));
        ctx.lineTo(mapX(maxX), mapY(0));
        ctx.strokeStyle = '#6c757d';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(mapX(mu), mapY(0));
        ctx.lineTo(mapX(mu), mapY(normalPDF(mu, mu, sigma)));
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = '#000';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`μ=${mu}`, mapX(mu), mapY(0) + 18);
        
        ctx.fillStyle = '#dc3545';
        ctx.font = 'bold 14px sans-serif';
        if (type === 'between') {
            ctx.fillText(val1, mapX(val1), mapY(0) + 18);
            ctx.fillText(val2, mapX(val2), mapY(0) + 18);
        } else {
            ctx.fillText(val1.toFixed(1), mapX(val1), mapY(0) + 18);
        }
    }

    function generateNewQuestion() {
        probData.mu = Math.floor(Math.random() * 400) + 100;
        probData.sigma = +(Math.random() * 7 + 1.5).toFixed(1);

        probData.ai_val = Math.floor(probData.mu - (Math.random() * 2 * probData.sigma));
        probData.aii_val = Math.floor(probData.mu - (Math.random() * 1.5 * probData.sigma));
        
        probData.aiii_low = Math.floor(probData.mu - (Math.random() * 2.5 * probData.sigma));
        probData.aiii_high = Math.ceil(probData.mu + (Math.random() * 1.5 * probData.sigma));
        if (probData.aiii_low >= probData.aiii_high) probData.aiii_high = probData.aiii_low + 5;

        probData.batch = (Math.floor(Math.random() * 4) + 1) * 500;
        
        // Locked generation to probabilities explicitly listed in the "Critical values" table section
        const percents = [1, 2.5, 5, 10]; 
        probData.c_percent = percents[Math.floor(Math.random() * percents.length)];

        solvedProbs = { ai: 0, aii: 0, aiii: 0, c_mass: 0 };

        renderQuestion();
    }

    window.onload = renderQuestion;
</script>

</body>
</html>
