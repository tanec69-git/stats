<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Normal Distribution Problem Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 700px;
            width: 100%;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            margin: 0;
        }
        .generate-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .generate-btn:hover {
            background-color: #2980b9;
        }
        .question-box {
            background-color: #e8f4f8;
            padding: 20px;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            margin-bottom: 30px;
            font-size: 1.15rem;
            line-height: 1.6;
            color: #0066cc; /* Matching the blue text from image_494efa.png */
        }
        .part-container {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .part-container:last-child {
            border-bottom: none;
        }
        .question-part {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #0066cc;
        }
        .solution-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 15px;
        }
        .solution-btn:hover {
            background-color: #27ae60;
        }
        .solution-box {
            background-color: #fdfefe;
            padding: 15px;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            display: none;
            line-height: 1.6;
        }
        .math {
            font-family: "Courier New", Courier, monospace;
            background-color: #f4f6f6;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            color: #d35400;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h2>Statistics Problem App</h2>
        <button class="generate-btn" onclick="generateNewQuestion()">Generate New Question</button>
    </div>
    
    <div class="question-box" id="question-text">
        <!-- Question text injected here -->
    </div>

    <!-- Part A -->
    <div class="part-container">
        <div class="question-part" id="part-a-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-a', this)">Show Solution</button>
        <div id="sol-a" class="solution-box"></div>
    </div>

    <!-- Part B -->
    <div class="part-container">
        <div class="question-part" id="part-b-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-b', this)">Show Solution</button>
        <div id="sol-b" class="solution-box"></div>
    </div>

    <!-- Part C -->
    <div class="part-container">
        <div class="question-part" id="part-c-text"></div>
        <button class="solution-btn" onclick="toggleSolution('sol-c', this)">Show Solution</button>
        <div id="sol-c" class="solution-box"></div>
    </div>

</div>

<script>
    // --- Data Libraries for Random Generation ---
    const subjects = ["contractor", "student", "machine", "chef", "athlete", "delivery driver"];
    const actions = ["paint a house", "complete an exam", "manufacture a specific part", "prepare a standard banquet", "run a 10km race", "complete a delivery route"];
    const variables = ["time (in minutes)", "time (in minutes)", "time (in seconds)", "time (in minutes)", "time (in minutes)", "time (in minutes)"];

    // Default data from "image_494efa.png"
    let currentData = {
        subject: "contractor",
        action: "paint a house",
        variable: "time (in minutes)",
        mu: 300,
        variance: 25,
        sigma: 5,
        x1: 312,
        x2: 291,
        x3: 286
    };

    // --- Math Helper Functions ---
    // Numerical approximation for the standard normal CDF (Phi)
    function normalCDF(z) {
        let isNegative = z < 0;
        z = Math.abs(z);
        const p = 0.2316419;
        const b1 = 0.319381530;
        const b2 = -0.356563782;
        const b3 = 1.781477937;
        const b4 = -1.821255978;
        const b5 = 1.330274429;
        
        const t = 1 / (1 + p * z);
        const pdf = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * z * z);
        const cdf = 1 - pdf * (b1 * t + b2 * Math.pow(t, 2) + b3 * Math.pow(t, 3) + b4 * Math.pow(t, 4) + b5 * Math.pow(t, 5));
        
        return isNegative ? (1 - cdf) : cdf;
    }

    // --- Core App Logic ---
    function renderApp() {
        // 1. Render Question
        const qBox = document.getElementById('question-text');
        qBox.innerHTML = `
            1. &nbsp;&nbsp; Let T be the ${currentData.variable} taken for a ${currentData.subject} to ${currentData.action}.<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Assume that T is N(${currentData.mu}, ${currentData.variance}).<br><br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Find<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (a) &nbsp;&nbsp; P(T &le; ${currentData.x1}),<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (b) &nbsp;&nbsp; P(T &le; ${currentData.x2}), and<br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (c) &nbsp;&nbsp; P(T &le; ${currentData.x3}).
        `;

        // 2. Render Part Texts
        document.getElementById('part-a-text').innerHTML = `(a) Find P(T &le; ${currentData.x1})`;
        document.getElementById('part-b-text').innerHTML = `(b) Find P(T &le; ${currentData.x2})`;
        document.getElementById('part-c-text').innerHTML = `(c) Find P(T &le; ${currentData.x3})`;

        // 3. Render Solutions
        renderSolution('sol-a', currentData.x1);
        renderSolution('sol-b', currentData.x2);
        renderSolution('sol-c', currentData.x3);

        // 4. Reset Button States
        resetButtons();
    }

    function renderSolution(elementId, xValue) {
        const solDiv = document.getElementById(elementId);
        const zValue = (xValue - currentData.mu) / currentData.sigma;
        const zRounded = zValue.toFixed(2);
        const prob = normalCDF(zValue).toFixed(4);
        
        let steps = `
            <p><strong>Step 1: Identify Parameters</strong><br>
            Mean (&mu;) = ${currentData.mu}<br>
            Variance (&sigma;<sup>2</sup>) = ${currentData.variance}, so Standard Deviation (&sigma;) = &radic;${currentData.variance} = ${currentData.sigma}</p>
            
            <p><strong>Step 2: Standardize to Z</strong><br>
            Formula: Z = (X - &mu;) / &sigma;<br>
            Z = (${xValue} - ${currentData.mu}) / ${currentData.sigma}<br>
            Z = ${zRounded}</p>
            
            <p><strong>Step 3: Find Probability</strong><br>
            P(T &le; ${xValue}) = P(Z &le; ${zRounded})<br>
        `;

        if (zValue < 0) {
            const positiveZ = Math.abs(zValue).toFixed(2);
            const positiveProb = normalCDF(Math.abs(zValue)).toFixed(4);
            steps += `
                For negative z-values, use the symmetry property: &Phi;(-z) = 1 - &Phi;(z).<br>
                P(Z &le; ${zRounded}) = 1 - &Phi;(${positiveZ})<br>
                Looking up &Phi;(${positiveZ}) gives ${positiveProb}.<br>
                <span class="math">1 - ${positiveProb} = ${prob}</span>
            `;
        } else {
            steps += `
                Looking up Z = ${zRounded} in the standard normal cumulative distribution table gives:<br>
                <span class="math">&Phi;(${zRounded}) = ${prob}</span>
            `;
        }
        
        steps += `</p>`;
        solDiv.innerHTML = steps;
    }

    function toggleSolution(id, button) {
        var solutionBox = document.getElementById(id);
        if (solutionBox.style.display === "none" || solutionBox.style.display === "") {
            solutionBox.style.display = "block";
            button.innerText = "Hide Solution";
            button.style.backgroundColor = "#e74c3c";
        } else {
            solutionBox.style.display = "none";
            button.innerText = "Show Solution";
            button.style.backgroundColor = "#2ecc71";
        }
    }

    function resetButtons() {
        const solutions = ['sol-a', 'sol-b', 'sol-c'];
        const buttons = document.querySelectorAll('.solution-btn');
        
        solutions.forEach(id => {
            document.getElementById(id).style.display = "none";
        });
        
        buttons.forEach(btn => {
            btn.innerText = "Show Solution";
            btn.style.backgroundColor = "#2ecc71";
        });
    }

    function generateNewQuestion() {
        // Pick random scenario
        const randIndex = Math.floor(Math.random() * subjects.length);
        currentData.subject = subjects[randIndex];
        currentData.action = actions[randIndex];
        currentData.variable = variables[randIndex];

        // Generate random math properties
        // Mean between 50 and 500 (multiples of 10 for cleanliness)
        currentData.mu = Math.floor((Math.random() * 45) + 5) * 10; 
        
        // Sigma between 2 and 15
        currentData.sigma = Math.floor((Math.random() * 14) + 2);
        currentData.variance = currentData.sigma * currentData.sigma;

        // Generate x values around the mean (-3 sigma to +3 sigma)
        function getRandomX() {
            let z = (Math.random() * 6) - 3; // Random Z between -3 and 3
            let x = Math.round(currentData.mu + (z * currentData.sigma));
            // Ensure we don't accidentally duplicate x values exactly
            return x;
        }

        currentData.x1 = getRandomX();
        let temp2 = getRandomX();
        while(temp2 === currentData.x1) temp2 = getRandomX();
        currentData.x2 = temp2;

        let temp3 = getRandomX();
        while(temp3 === currentData.x1 || temp3 === currentData.x2) temp3 = getRandomX();
        currentData.x3 = temp3;

        // Ensure at least one value is greater than mean, and one is less (to show both positive/negative Z logic)
        currentData.x1 = currentData.mu + Math.floor(Math.random() * 2.5 * currentData.sigma) + 1; // Positive Z
        currentData.x2 = currentData.mu - Math.floor(Math.random() * 2.5 * currentData.sigma) - 1; // Negative Z
        currentData.x3 = currentData.mu - Math.floor(Math.random() * 1.5 * currentData.sigma) - 1; // Another Negative Z (matching original problem pattern)

        renderApp();
    }

    // Initialize the app on load with default values from the image
    window.onload = renderApp;

</script>

</body>
</html>
